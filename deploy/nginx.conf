# Hermes v2 — nginx reverse proxy
# Hardened: HTTPS (Let's Encrypt), rate limiting, security headers, CORS, CSP
#
# TLS cert: Let's Encrypt via Certbot (issued 2026-05-21, expires 2026-08-19)
#   cert:  /etc/letsencrypt/live/artek-studio.com/fullchain.pem
#   key:   /etc/letsencrypt/live/artek-studio.com/privkey.pem
#   auto-renewal: certbot.timer systemd unit (installed by Certbot)
#
# Domain: artek-studio.com / www.artek-studio.com / hermes.artek-studio.com → 46.225.14.26

# Granular rate limit zones
# ---------------------------------------------------------------------------
# REAL CLIENT IP (S150, 2026-07-28)
# Traffic reaches nginx through a cloudflared tunnel on loopback, so $remote_addr
# was ALWAYS 127.0.0.1. Consequences: every client shared ONE limit_req bucket,
# the TradingView allow/deny list could never match, and access logs were blind.
# cloudflared forwards the true client IP in CF-Connecting-IP (measured, S150).
# Must appear before limit_req_zone so $binary_remote_addr is the real client.
set_real_ip_from 127.0.0.1;
real_ip_header   CF-Connecting-IP;
real_ip_recursive off;
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=api_general:10m  rate=10r/s;   # default API traffic
limit_req_zone $binary_remote_addr zone=api_metrics:10m  rate=2r/s;    # /metrics (heavy scan)
limit_req_zone $binary_remote_addr zone=api_health:10m   rate=30r/s;   # /health (frequent monitors)
limit_req_zone $binary_remote_addr zone=api_webhook:10m  rate=30r/s;   # /webhook (already IP-gated)

# Mask ?token= query param from webhook URL in access logs
map $request_uri $masked_uri {
    "~^(/webhook/tradingview)\?token=[^&]*(.*)$" "$1?token=REDACTED$2";
    default $request_uri;
}

# Log format using masked URI (keeps ?token= out of access logs)

log_format hermes_masked '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $masked_uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# HTTP → HTTPS redirect (port 80 only — NOT port 8000)
server {
    listen 80;
    server_name artek-studio.com www.artek-studio.com hermes.artek-studio.com;
    return 301 https://$host$request_uri;
}

# Port 8000 HTTP server — Cloudflare tunnel sends plain HTTP here
# Cloudflare terminates TLS at the edge; traffic arrives as plain HTTP on 8000
# This block must NOT use ssl_* directives — it is plain HTTP only
server {
    listen 8000;
    server_name artek-studio.com www.artek-studio.com hermes.artek-studio.com _;

    # Runtime DNS resolution for the external (Vercel) upstreams below.
    # Without this, a literal hostname in proxy_pass is resolved at CONFIG-PARSE
    # time and a transient DNS gap is a fatal [emerg] that takes the whole server
    # down and keeps it down (outage 2026-07-28 06:25->10:36 UTC, 4h10m, after an
    # unattended glibc upgrade mass-restarted systemd-resolved alongside nginx).
    # With a variable upstream + resolver, a DNS failure degrades to a 502 on that
    # one location instead of killing /health, /metrics and the whole API surface.
    resolver         127.0.0.53 valid=30s ipv6=off;   # systemd-resolved stub
    resolver_timeout 5s;

    # Security headers (no HSTS — plain HTTP, Cloudflare adds it at edge)
    add_header X-Frame-Options            DENY                                  always;
    add_header X-Content-Type-Options     nosniff                               always;
    add_header X-XSS-Protection           "1; mode=block"                       always;
    add_header Referrer-Policy            "no-referrer-when-downgrade"          always;
    add_header Content-Security-Policy    "default-src 'none'; frame-ancestors 'none'" always;
    add_header Access-Control-Allow-Origin  "https://www.artek-studio.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"            always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;

    if ($request_method = OPTIONS) { return 204; }

    access_log /var/log/nginx/access.log hermes_masked;

    # ACME HTTP-01 challenge (served via Cloudflare Tunnel -> this port).
    # certbot webroot authenticator drops tokens here; must precede the
    # catch-all proxy_pass below so challenges are not forwarded to FastAPI.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = / {
        limit_req zone=api_general burst=20 nodelay;
        root /opt/hermes_v2/public;
        try_files /index.html =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /metrics {
        limit_req zone=api_metrics burst=5 nodelay;
        proxy_pass http://100.97.62.7:8001/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        limit_req zone=api_health burst=10 nodelay;
        proxy_pass http://100.97.62.7:8001/health;
        add_header Cache-Control "no-cache" always;
    }

    location /dashboard {
        limit_req zone=api_general burst=20 nodelay;
        set $dashboard_upstream "hermes-v2.vercel.app";
        proxy_pass         https://$dashboard_upstream$request_uri;
        proxy_set_header   Host              hermes-v2.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options     nosniff                               always;
        add_header Referrer-Policy            "no-referrer-when-downgrade"          always;
        add_header Content-Security-Policy    "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;
        add_header X-Frame-Options            "SAMEORIGIN"                          always;
    }

    # Crypto-signals proxy — page HTML arrives via Next.js rewrite (hermes-v2 → crypto-signals).
    # The crypto-signals app has no basePath, so its static assets and API are at bare paths.
    # hermes-v2's own Next.js assets use /dashboard/_next/ (basePath), so /_next/ is safe
    # to route exclusively to crypto-signals.
    location /_next/ {
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/_next/;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;
    }

    location /api/signals {
        limit_req zone=api_general burst=20 nodelay;
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/api/signals;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    35s;
    }

    location /api/history {
        limit_req zone=api_general burst=20 nodelay;
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/api/history;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    35s;
    }

    location /api/health {
        limit_req zone=api_health burst=10 nodelay;
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/api/health;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;
        add_header Cache-Control "no-cache" always;
    }

    location /api/performance {
        limit_req zone=api_general burst=20 nodelay;
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/api/performance;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;
    }

    location /api/server-health {
        limit_req zone=api_health burst=10 nodelay;
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/api/server-health;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;
        add_header Cache-Control "no-cache" always;
    }

    location /grafana/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3000/grafana/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options     nosniff                               always;
        add_header Referrer-Policy            "no-referrer-when-downgrade"          always;
        add_header Content-Security-Policy    "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;
        add_header X-Frame-Options            "SAMEORIGIN"                          always;
    }

    # SECURITY (S150 2026-07-28): /run/* starts heavy agent jobs (train/audit/report)
    # with NO auth and NO TRAINING_ENABLED / HERMES_ROLE gate. Never expose to the internet.
    # Trigger on-box instead (bypasses nginx): curl -X POST http://100.97.62.7:8001/run/<job>
    location ~ ^/run(/|$) {
        deny all;
    }

    location /webhook/tradingview {
        limit_req zone=api_webhook burst=50 nodelay;
        allow 52.89.214.238;
        allow 34.212.75.30;
        allow 54.218.53.128;
        allow 52.32.178.7;
        deny  all;
        proxy_pass         http://100.97.62.7:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass         http://100.97.62.7:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}

# HTTPS server (all domains) — for direct access and fallback
server {
    listen 443 ssl;
    server_name artek-studio.com www.artek-studio.com hermes.artek-studio.com;

    # Runtime DNS resolution for the external (Vercel) upstreams below.
    # Without this, a literal hostname in proxy_pass is resolved at CONFIG-PARSE
    # time and a transient DNS gap is a fatal [emerg] that takes the whole server
    # down and keeps it down (outage 2026-07-28 06:25->10:36 UTC, 4h10m, after an
    # unattended glibc upgrade mass-restarted systemd-resolved alongside nginx).
    # With a variable upstream + resolver, a DNS failure degrades to a 502 on that
    # one location instead of killing /health, /metrics and the whole API surface.
    resolver         127.0.0.53 valid=30s ipv6=off;   # systemd-resolved stub
    resolver_timeout 5s;

    # TLS — Let's Encrypt cert (auto-renews via certbot.timer)
    ssl_certificate     /etc/letsencrypt/live/artek-studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artek-studio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (inherited by location blocks that add no headers of their own)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            DENY                                  always;
    add_header X-Content-Type-Options     nosniff                               always;
    add_header X-XSS-Protection           "1; mode=block"                       always;
    add_header Referrer-Policy            "no-referrer-when-downgrade"          always;
    # CSP: API + landing page serve no active content — lock down completely.
    # location blocks that proxy rich web apps (dashboard, grafana) re-declare headers
    # without this directive to avoid breaking those apps (nginx add_header inheritance).
    add_header Content-Security-Policy    "default-src 'none'; frame-ancestors 'none'" always;

    # CORS — allow all project domains
    add_header Access-Control-Allow-Origin  "https://www.artek-studio.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"            always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;

    # Preflight fast-path
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Use masked log format to redact ?token= from webhook URLs
    access_log /var/log/nginx/access.log hermes_masked;

    # Static landing page (exact root only)
    location = / {
        limit_req zone=api_general burst=20 nodelay;
        root /opt/hermes_v2/public;
        try_files /index.html =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # /metrics — rate-limited more tightly (expensive GROUP BY scan, 60s cached)
    location = /metrics {
        limit_req zone=api_metrics burst=5 nodelay;
        proxy_pass         http://100.97.62.7:8001/metrics;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /health — generous limit for monitoring agents that poll frequently
    location = /health {
        limit_req zone=api_health burst=10 nodelay;
        proxy_pass         http://100.97.62.7:8001/health;
        proxy_cache_bypass $http_cache_control;
        add_header         Cache-Control "no-cache" always;
    }

    # All other API routes
    location / {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass         http://100.97.62.7:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Dashboard — proxy to Vercel (Next.js app with basePath: '/dashboard')
    # Re-declares all security headers without restrictive CSP (nginx add_header
    # inheritance: child blocks with their own add_header don't inherit parent headers).
    location /dashboard {
        limit_req zone=api_general burst=20 nodelay;
        set $dashboard_upstream "hermes-v2.vercel.app";
        proxy_pass         https://$dashboard_upstream$request_uri;
        proxy_set_header   Host              hermes-v2.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        # Security headers without restrictive CSP — Next.js requires scripts + styles
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options     nosniff                               always;
        add_header Referrer-Policy            "no-referrer-when-downgrade"          always;
        add_header Content-Security-Policy    "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;
        add_header X-Frame-Options            "SAMEORIGIN"                          always;
    }

    location /_next/ {
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/_next/;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;
    }

    location /api/signals {
        limit_req zone=api_general burst=20 nodelay;
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/api/signals;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    35s;
    }

    location /api/history {
        limit_req zone=api_general burst=20 nodelay;
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/api/history;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    35s;
    }

    location /api/health {
        limit_req zone=api_health burst=10 nodelay;
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/api/health;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;
        add_header Cache-Control "no-cache" always;
    }

    location /api/performance {
        limit_req zone=api_general burst=20 nodelay;
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/api/performance;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;
    }

    location /api/server-health {
        limit_req zone=api_health burst=10 nodelay;
        set $cs_upstream "crypto-signals-rust.vercel.app";
        proxy_pass         https://$cs_upstream/api/server-health;
        proxy_set_header   Host              crypto-signals-rust.vercel.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;
        add_header Cache-Control "no-cache" always;
    }

    # Grafana — exposed via nginx subpath; Grafana must be configured with
    # root_url = https://www.artek-studio.com/grafana/ and serve_from_sub_path = true
    location /grafana/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3000/grafana/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        # Security headers without restrictive CSP — Grafana requires scripts + styles
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options     nosniff                               always;
        add_header Referrer-Policy            "no-referrer-when-downgrade"          always;
        add_header Content-Security-Policy    "default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;
        add_header X-Frame-Options            "SAMEORIGIN"                          always;
    }

    # TradingView webhook — IP allowlist + token auth in app layer
    # IP list: https://www.tradingview.com/support/solutions/43000529348
    # SECURITY (S150 2026-07-28): /run/* starts heavy agent jobs (train/audit/report)
    # with NO auth and NO TRAINING_ENABLED / HERMES_ROLE gate. Never expose to the internet.
    # Trigger on-box instead (bypasses nginx): curl -X POST http://100.97.62.7:8001/run/<job>
    location ~ ^/run(/|$) {
        deny all;
    }

    location /webhook/tradingview {
        limit_req zone=api_webhook burst=50 nodelay;
        allow 52.89.214.238;
        allow 34.212.75.30;
        allow 54.218.53.128;
        allow 52.32.178.7;
        deny  all;
        proxy_pass         http://100.97.62.7:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
