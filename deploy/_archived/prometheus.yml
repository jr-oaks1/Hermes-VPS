global:
  scrape_interval:     30s
  evaluation_interval: 30s

rule_files:
  - '/opt/hermes-vps/deploy/prometheus_rules.yml'

scrape_configs:
  - job_name: 'hermes_v2'
    static_configs:
      - targets: ['localhost:8001']
    metrics_path: '/metrics'
    scheme: http
    # No auth needed — APIKeyMiddleware bypasses auth for 127.0.0.1 (localhost scrapes).
    # nginx still enforces X-API-Key for all external requests to /metrics.

  - job_name: 'cloudflared'
    static_configs:
      - targets: ['localhost:7844']
    metrics_path: '/metrics'
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 10s
