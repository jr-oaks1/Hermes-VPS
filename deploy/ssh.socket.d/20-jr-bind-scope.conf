# APPLIED LIVE — JR Hermes VPS S22 (2026-09-11), forensic-audit finding B3.
# Deployed to /etc/systemd/system/ssh.socket.d/ with a 10-min auto-revert
# armed; both :22 (Tailscale) and :52222 (public fallback) verified reachable
# before the revert was disarmed. This file is the tracked copy for reference
# and re-deploy — the runbook below still applies to any future re-apply
# (e.g. after a host rebuild).
# ---------------------------------------------------------------------------
# Purpose: bind the port-22 SSH listener to the Tailscale address + loopback
# only, so :22 is never exposed on the public interface even if UFW's eth0
# default-deny is ever misconfigured. The public admin fallback stays on
# :52222 (0.0.0.0 / [::]), unchanged — that path must keep working.
#
# WHY A RESET IS NEEDED: ListenStream= in a drop-in APPENDS to the vendor
# unit's list, which is `ListenStream=22` (binds 0.0.0.0:22 AND [::]:22).
# A single empty `ListenStream=` clears the whole accumulated list; the
# lines below then rebuild it explicitly. 10-jr-extra-port.conf's two
# 52222 lines still apply (drop-ins merge by filename order), so the final
# set is:  100.97.62.7:22, 127.0.0.1:22, [::1]:22, 0.0.0.0:52222, [::]:52222
#
# LOCK-OUT RISK: if the Tailscale IP ever changes or tailscaled is down at
# boot, :22 will not bind. That is acceptable ONLY because :52222 is an
# independent public path (verified working S22). Keep the current SSH
# session open during apply and confirm a NEW :22 (Tailscale) connection
# AND a :52222 connection before trusting the change.
#
# APPLY RUNBOOK (host, as root, with an auto-revert timer armed):
#   mkdir -p /etc/systemd/system/ssh.socket.d
#   cp deploy/ssh.socket.d/20-jr-bind-scope.conf \
#      /etc/systemd/system/ssh.socket.d/20-jr-bind-scope.conf
#   # arm a 10-min auto-revert BEFORE reloading:
#   ( sleep 600; rm -f /etc/systemd/system/ssh.socket.d/20-jr-bind-scope.conf; \
#     systemctl daemon-reload; systemctl restart ssh.socket ) &
#   REVERT_PID=$!
#   systemd-analyze verify /etc/systemd/system/ssh.socket
#   systemctl daemon-reload && systemctl restart ssh.socket
#   ss -tlnpe | grep -E ':22 |:52222 '   # expect :22 only on 100.97.62.7 + 127.0.0.1
#   # from the workstation, in a SEPARATE shell:
#   #   ssh -i ~/.ssh/hermes_ed25519 root@100.97.62.7 hostname       # Tailscale :22
#   #   ssh -i ~/.ssh/hermes_ed25519 -p 52222 root@46.225.14.26 hostname  # public fallback
#   # BOTH must succeed. Only then disarm the revert:
#   kill "$REVERT_PID"
#
# ROLLBACK: rm the file, `systemctl daemon-reload && systemctl restart ssh.socket`.
# ---------------------------------------------------------------------------
[Socket]
ListenStream=
ListenStream=100.97.62.7:22
ListenStream=127.0.0.1:22
ListenStream=[::1]:22
ListenStream=0.0.0.0:52222
ListenStream=[::]:52222
